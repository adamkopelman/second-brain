<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTD Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="board">
  <header>
    <h1>GTD Dashboard</h1>
    <div class="kpis" id="kpis"></div>
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search tasks... (press / to focus)">
      <button id="new-task-btn" type="button" title="New task (n)">+ New task</button>
      <button id="theme-toggle" type="button" title="Toggle light/dark">Theme</button>
    </div>
  </header>
  <main class="grid">
    <section class="card span2"><h2>Tasks</h2><div id="tasks"></div></section>
    <section class="card"><h2>Due soon</h2><div id="due-soon"></div></section>
    <section class="card"><h2>Waiting for</h2><div id="waiting"></div></section>
    <section class="card"><h2>Active projects</h2><div id="projects"></div></section>
    <section class="card"><h2>Someday / Maybe</h2><div id="someday"></div></section>
    <section class="card card-attn"><h2>Needs triage</h2><div id="needs-triage"></div></section>
    <section class="card">
      <h2>Meetings</h2>
      <button id="transcribe-btn" type="button">Transcribe pending</button>
      <div id="meetings"></div>
    </section>
  </main>
</div>
<div id="quick-add" class="modal hidden">
  <form id="quick-add-form">
    <div class="modal-head">
      <h2>New task</h2>
      <button id="quick-add-close" type="button" title="Close" aria-label="Close">×</button>
    </div>
    <input id="quick-add-text" type="text" placeholder="Task text" autocomplete="off">
    <select id="quick-add-context">
      <option value="computer">computer</option>
      <option value="phone">phone</option>
      <option value="errands">errands</option>
      <option value="home">home</option>
      <option value="office">office</option>
      <option value="anywhere">anywhere</option>
      <option value="agenda">agenda</option>
    </select>
    <input id="quick-add-project" type="text" placeholder="Project (optional)" autocomplete="off">
    <button type="submit">Add task</button>
  </form>
</div>
<div id="detail-modal" class="modal hidden">
  <div class="detail-panel">
    <div class="modal-head">
      <h2 id="detail-title">Detail</h2>
      <button id="detail-modal-close" type="button" title="Close" aria-label="Close">×</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
