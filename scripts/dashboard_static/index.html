<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTD Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <h1>GTD</h1>
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search… ( / )" aria-label="Search" dir="auto" autocomplete="off">
      <button id="record-btn" type="button" title="Record a meeting (r)">● Record</button>
      <button id="new-task-btn" type="button" title="New task (n)">+ New</button>
      <button id="help-btn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button id="theme-toggle" type="button" title="Toggle light/dark" aria-label="Toggle light/dark">◐</button>
    </div>
  </div>
</header>
<main>
  <div id="filter-banner" class="filter-banner" hidden></div>
  <section class="page" id="page-today"><div id="today"></div></section>
  <section class="page" id="page-week" hidden><div id="week"></div></section>
  <section class="page" id="page-tasks" hidden><div id="tasks"></div></section>
  <section class="page" id="page-inbox" hidden><div id="inbox"></div></section>
  <section class="page" id="page-waiting" hidden><div id="waiting"></div></section>
  <section class="page" id="page-projects" hidden><div id="projects"></div></section>
</main>
<div id="quick-add" class="modal hidden">
  <form id="quick-add-form">
    <div class="modal-head">
      <h2>New task</h2>
      <button id="quick-add-close" type="button" title="Close" aria-label="Close">×</button>
    </div>
    <input id="quick-add-text" type="text" placeholder="Task text" autocomplete="off" dir="auto">
    <select id="quick-add-context">
      <option value="computer">computer</option>
      <option value="phone">phone</option>
      <option value="errands">errands</option>
      <option value="home">home</option>
      <option value="office">office</option>
      <option value="anywhere">anywhere</option>
      <option value="agenda">agenda</option>
    </select>
    <input id="quick-add-project" type="text" placeholder="Project (optional)" autocomplete="off" dir="auto">
    <button type="submit">Add task</button>
  </form>
</div>
<div id="detail-modal" class="modal hidden">
  <div class="detail-panel">
    <div class="modal-head">
      <h2 id="detail-title">Detail</h2>
      <button id="detail-modal-close" type="button" title="Close" aria-label="Close">×</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="recorder.js"></script>
<script src="app.js"></script>
</body>
</html>
